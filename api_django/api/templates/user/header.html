{% load static %}
<!DOCTYPE html>
<html>
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="{% static '/user/css/normalize.css' %}">
    <link rel="stylesheet" href="{% static '/user/css/style.css' %}">


    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
          integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

    <!-- reference to your installed Font Awesome Free package's files here -->
    <script src="{% static 'fontawesomefree/js/all.min.js' %}"></script>
    <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet" type="text/css">

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'main/main.css' %}">

    <!-- Jquery JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

</head>
<body>
    {% include 'user/navbar.html' %}
     <div class="flex-container">
            <ul id="mainmenu" class="mainmenu">
                <li class="header__link-logo"><a href="{% url 'home' %}" >
                    Gosparsick
<!--                    <div class="logo"></div>-->
                </a></li>
                {% for m in menu %}
                <li><a href="{% url m.url_name %}">{{m.title}}</a></li>
                {% endfor %}
                {% if request.user.is_authenticated %}
                <li class="last"><a href="{% url 'parse' %}">Новый запрос</a>  <a href="{% url 'my_orders' %}">Мои запросы </a>  <a href="{% url 'logout' %}">Выйти</a></li>
                {% else %}
                <li class="last"><a href="{% url 'register' %}">Регистрация</a>  <a href="{% url 'login' %}">Войти</a></li>
                {% endif %}
            </ul>
            <div class="clear"></div>
        </div>
    <main role="main" class="container-xl">
        <background class="my_back">
            <div class="row">
                <div class="col-lg-12 col-md-12-p-0 col-sm-12">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </background>
    </main>

    <!-- Prism JS -->
    <script src="{% static 'prism.js' %}"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"
        integrity="sha384-+YQ4JLhjyBLPDQt//I+STsc9iw4uQqACwlvpslubQzn4u2UU2UFM80nGisd026JF"
        crossorigin="anonymous"></script>

    <!-- Optional JavaScript -->
    <script type="text/javascript" src="{% static 'main/custom.js' %}"></script>
</body>
<footer class="footer">
                <div class="footer__container container">
                </div>
        </footer>
</html>
