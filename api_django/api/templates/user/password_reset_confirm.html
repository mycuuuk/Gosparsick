{% extends 'user/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <h2>Смена пароля</h2><hr>
        <p>Пожалуйста введите ваш новый пароль.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-outline-info" type="submit">Изменить пароль</button>
        </form>
    </div>
{% endblock %}
