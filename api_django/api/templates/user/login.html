{% extends 'user/base.html' %}

{% block content %}
<h1 class="hero__title">{{title}}</h1>

<form method="post">
  {% csrf_token %}

<div class="form-error">{{ form.non_field_errors }}</div>

{% for f in form %}
<p><label class="text-field__label" for="{{ f.id_for_label }}">{{f.label}}: </label>{{ f }}</p>
<div class="form-error">{{ f.errors }}</div>
{% endfor %}
  <p><a class="link" href="{% url "password_reset" %}">Забыли пароль?</a></p>
  <button class="web__app__btn btn-reset" type="submit">Войти</button>
</form>

{% endblock %}
