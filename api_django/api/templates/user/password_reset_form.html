{% extends 'user/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
	<div class="content-section">
  	 	<h2>Восстановление пароля</h2><hr>
		<p>Забыли пароль? Введите вашу почту ниже, и мы отправим вам сообщение для восстановления пароля.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-outline-info" type="submit">Отправить сообщение</button>
        </form>
  	</div>
{% endblock %}
